name: opsagent-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: opsagent
      POSTGRES_USER: opsagent
      POSTGRES_PASSWORD: opsagent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsagent -d opsagent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: opsagent
      MINIO_ROOT_PASSWORD: opsagent-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mysql-test:
    profiles: ["test-tools"]
    image: docker.1ms.run/library/mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: opsagent_test
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot database reset/seed for local development:
  #   docker compose run --rm seed
  seed:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter @opsagent/control seed:dev
    environment:
      DATABASE_URL: postgres://opsagent:opsagent@postgres:5432/opsagent
      LOCAL_ADMIN_USERNAME: tenant-admin
      LOCAL_ADMIN_PASSWORD: opsagent-dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/control/node_modules
      - /app/apps/web/node_modules
      - /app/packages/contracts/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  control:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -lc "chmod 600 /root/.dsh/.credentials.yaml 2>/dev/null || true; exec pnpm --filter @opsagent/control exec tsx watch src/index.ts"
    environment:
      CI: "true"
      DATABASE_URL: postgres://opsagent:opsagent@postgres:5432/opsagent
      REDIS_URL: redis://redis:6379
      LOCAL_ADMIN_ENABLED: "true"
      LOCAL_ADMIN_USERNAME: tenant-admin
      LOCAL_ADMIN_USERNAMES: tenant-admin,platform-admin
      DSH_HOME: /root/.dsh
      DSH_RUNTIME_ENABLED: "true"
      DSH_ACCOUNT_AUTH: "true"
      DSH_ACCOUNT_MODEL: deepseek-flash
      DSH_PERMISSION_MODE: danger-full-access
      OPSAGENT_WORKSPACE_ROOT: /app
      STUDIO_DSH_ENABLED: "true"
      OPSAGENT_AGENT_ENROLLMENT_TOKEN: opsagent-local-enroll
      OPSAGENT_AGENT_DIST_DIR: /app/agents/opsagent-agent/dist
      OPSAGENT_DESKTOP_UPDATE_DIR: /app/apps/desktop/release/feed
      OPSAGENT_PUBLIC_URL: http://127.0.0.1:8080
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ./.dsh-runtime:/root/.dsh
      - /app/node_modules
      - /app/apps/control/node_modules
      - /app/apps/web/node_modules
      - /app/packages/contracts/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: pnpm --filter @opsagent/web exec vite --host 0.0.0.0 --port 5173
    environment:
      CI: "true"
      VITE_API_PROXY: http://control:8080
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/control/node_modules
      - /app/apps/web/node_modules
      - /app/packages/contracts/node_modules
    depends_on:
      control:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
